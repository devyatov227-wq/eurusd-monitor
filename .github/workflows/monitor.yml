
name: EURUSD read-only monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in repository:"
          ls -la
          echo "Python monitor file:"
          find . -maxdepth 3 -iname 'monitor.py' -print

      - name: Run monitor
        run: python ./monitor.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 7
