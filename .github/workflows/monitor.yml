
name: EURUSD read-only monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        run: python monitor.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 7
