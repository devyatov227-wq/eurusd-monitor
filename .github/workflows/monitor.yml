      - name: Save history to GitHub
        run: |
          cp history.json /tmp/local-history.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from pathlib import Path

          local = json.loads(Path("/tmp/local-history.json").read_text())
          remote_path = Path("history.json")
          remote = json.loads(remote_path.read_text()) if remote_path.exists() else {}

          candles = {}
          for candle in remote.get("candles", []) + local.get("candles", []):
              candles[candle["openTime"]] = candle

          result = {
              **remote,
              **local,
              "symbol": local.get("symbol", remote.get("symbol", "EURUSD")),
              "interval": local.get("interval", remote.get("interval", "1m")),
              "candles": sorted(candles.values(), key=lambda x: x["openTime"])[-10000:]
          }

          remote_path.write_text(json.dumps(result, indent=2) + "\n")
          print("Merged unique candles:", len(result["candles"]))
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json

            if git diff --cached --quiet; then
              echo "History is already up to date"
              exit 0
            fi

            git commit -m "Update EURUSD candle history"

            if git push origin HEAD:main; then
              echo "History saved successfully"
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying..."
          done

          echo "Could not save history after 3 attempts"
          exit 1
