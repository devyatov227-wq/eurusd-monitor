name: EURUSD monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: eurusd-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        run: python ./monitor.py

      - name: Show report
        run: cat report.json

      - name: Save history to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update EURUSD candle history"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No history changes to save"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 7
